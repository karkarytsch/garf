[project]
name = "garf-backend"
version = "0.1.0"
description = "Local dataset import API for Garf"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "python-multipart>=0.0.9,<1.0",
  "pandas>=2.2,<3.0",
  "openpyxl>=3.1,<4.0",
  "pyarrow>=17,<20",
]

[dependency-groups]
dev = [
  "pytest>=8.0,<9.0",
  "httpx>=0.27,<1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
